name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install -r requirements.txt pytest cryptography

      - name: Compila (py_compile)
        run: python -m py_compile SCRIPT_EXPLICA.py iniciar_monitor.pyw ferramentas/gerar_versao.py ferramentas/versao_atual.py LIMPAR_LIXO.py iniciar_explica.py executar_invisivel_explica.py

      - name: versao.json (sha256 em LF, versão e assinatura Ed25519)
        run: python ferramentas/gerar_versao.py --verificar

      - name: Testes de unidade, versão e supervisor
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q tests
