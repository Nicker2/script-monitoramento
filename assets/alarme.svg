<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Ilustração da janela de alarme: NOVA SENHA 'DILATAÇÃO - CCC' NA FILA, com o botão CIENTE">
  <rect width="800" height="450" rx="14" fill="#990000"/>
  <rect x="40" y="60" width="720" height="240" rx="30" fill="#ffffff" stroke="#cccccc" stroke-width="2"/>

  <!-- ícones de alerta -->
  <g id="icone">
    <path d="M110 80 L150 150 L70 150 Z" fill="#f59e0b" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
    <rect x="106" y="100" width="8" height="28" rx="3" fill="#1f2937"/>
    <circle cx="110" cy="139" r="5" fill="#1f2937"/>
  </g>
  <use href="#icone" transform="translate(580 0)"/>

  <text x="400" y="130" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#000000">NOVA SENHA 'DILATAÇÃO - CCC' NA FILA</text>
  <text x="400" y="215" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#555555">Clique em CIENTE (ou Enter / Espaço / Esc) para assumir o atendimento</text>
  <text x="400" y="245" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#555555">e pausar os alertas sonoros por 15 minutos.</text>

  <!-- botão CIENTE -->
  <rect x="300" y="335" width="200" height="66" rx="4" fill="#dddddd" stroke="#888888" stroke-width="4"/>
  <text x="400" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#000000">CIENTE</text>

  <text x="785" y="438" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#f3c4c4">ilustração — a janela real pisca no centro da tela</text>
</svg>
